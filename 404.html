<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function () {
      var hostname = window.location.hostname;
      var pathname = window.location.pathname;
      var isGithub = hostname.endsWith('github.io');
      var repo = pathname.split('/')[1] || 'harichandsteel';
      var baseHref = isGithub ? '/' + repo + '/' : '/';
      document.write('<base href="' + baseHref + '">');

      // Instant client-side redirect: strip .html on GitHub Pages & static hosts
      if (pathname.endsWith('.html') || pathname.endsWith('.htm')) {
        var clean = pathname.replace(/\.html?$/i, '');
        var target = (clean.endsWith('/index') || clean === '/index' || clean === '/' + repo + '/index' || clean === '/' + repo)
          ? baseHref
          : clean + '/';
        window.location.replace(target + window.location.search + window.location.hash);
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | HARICHAND STEEL</title>
  <link rel="stylesheet" href="css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // GitHub Pages SPA redirect handler
    (function () {
      var path = window.location.pathname;
      var isGithub = window.location.hostname.endsWith('github.io');
      var prefix = isGithub ? '/harichandsteel' : '';
      var cleanPath = path.replace(prefix, '');

      // If it's a product detail route: /product/:slug/
      var prodMatch = cleanPath.match(/^\/product\/([a-zA-Z0-9_-]+)\/?$/i);
      if (prodMatch && prodMatch[1] !== 'page') {
        window.location.replace((isGithub ? '/harichandsteel' : '') + '/product-detail/?slug=' + encodeURIComponent(prodMatch[1]));
        return;
      }

      // If it's a product category route: /product-category/:category/
      var catMatch = cleanPath.match(/^\/product-category\/([a-zA-Z0-9_-]+)\/?$/i);
      if (catMatch) {
        window.location.replace((isGithub ? '/harichandsteel' : '') + '/product/?category=' + encodeURIComponent(catMatch[1]));
        return;
      }
    })();
  </script>
</head>
