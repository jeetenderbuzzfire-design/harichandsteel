<!DOCTYPE html>
<html lang="en">

<head>
  <script>
    (function () {
      var isGithub = window.location.hostname.endsWith('github.io');
      var repo = window.location.pathname.split('/')[1] || 'harichandsteel';
      var baseHref = isGithub ? '/' + repo + '/' : '/';
      document.write('<base href="' + baseHref + '">');
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <script>
    (function () {
      var isGithub = window.location.hostname.endsWith('github.io');
      var repo = window.location.pathname.split('/')[1] || 'harichandsteel';
      var baseHref = isGithub ? '/' + repo + '/' : '/';
      document.write('<base href="' + baseHref + '">');
    })();
  </script>
  <title>Admin Login | Harichand Steel CMS</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/x-icon" href="../images/favicon.ico">

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/all.min.css">

  <style>
    :root {
      --admin-bg: #090c10;
      --admin-card: #131922;
      --admin-border: #243040;
      --admin-border-focus: #d32f2f;
      --admin-text: #f8fafc;
      --admin-text-muted: #94a3b8;
      --admin-primary: #d32f2f;
      --admin-primary-hover: #b71c1c;
      --admin-danger: #ef4444;
      --admin-success: #22c55e;
      --admin-radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--admin-bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(211, 47, 47, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(245, 158, 11, 0.08) 0px, transparent 50%);
      color: var(--admin-text);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
    }

    .login-card {
      background: var(--admin-card);
      border: 1px solid var(--admin-border);
      border-radius: var(--admin-radius);
      padding: 40px 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 1px 3px rgba(255, 255, 255, 0.05);
      position: relative;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .login-card.shake {
      animation: shakeCard 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    @keyframes shakeCard {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(4px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
      40%, 60% { transform: translate3d(6px, 0, 0); }
    }

    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-logo {
      width: 64px;
      height: 64px;
      border-radius: 12px;
      border: 2px solid rgba(211, 47, 47, 0.3);
      padding: 4px;
      background: #000;
      margin-bottom: 14px;
      box-shadow: 0 4px 12px rgba(211, 47, 47, 0.25);
    }

    .brand-title {
      font-family: 'Oswald', sans-serif;
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #fff;
      margin-bottom: 4px;
    }

    .brand-subtitle {
      font-size: 0.85rem;
      color: var(--admin-text-muted);
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .security-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      background: rgba(211, 47, 47, 0.12);
      border: 1px solid rgba(211, 47, 47, 0.25);
      color: #ff6b6b;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-top: 10px;
      text-transform: uppercase;
    }

    .login-alert {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.88rem;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      line-height: 1.4;
      transition: all 0.2s ease;
    }

    .login-alert.error {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
    }

    .login-alert.success {
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.35);
      color: #86efac;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #e2e8f0;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: var(--admin-text-muted);
      font-size: 0.95rem;
      pointer-events: none;
      transition: color 0.2s ease;
    }

    .form-input {
      width: 100%;
      background: #090d12;
      border: 1px solid var(--admin-border);
      border-radius: 8px;
      padding: 12px 14px 12px 42px;
      font-size: 0.95rem;
      color: #fff;
      font-family: inherit;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--admin-primary);
      box-shadow: 0 0 0 3px rgba(211, 47, 47, 0.2);
    }

    .form-input:focus + .input-icon,
    .form-input:focus ~ .input-icon {
      color: var(--admin-primary);
    }

    .toggle-password {
      position: absolute;
      right: 14px;
      background: none;
      border: none;
      color: var(--admin-text-muted);
      cursor: pointer;
      padding: 4px;
      font-size: 0.95rem;
      transition: color 0.2s ease;
    }

    .toggle-password:hover {
      color: #fff;
    }

    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      font-size: 0.82rem;
      color: var(--admin-text-muted);
    }

    .remember-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }

    .remember-label input[type="checkbox"] {
      accent-color: var(--admin-primary);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .btn-submit {
      width: 100%;
      background: var(--admin-primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 13px 20px;
      font-size: 0.98rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 14px rgba(211, 47, 47, 0.4);
      transition: background-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
    }

    .btn-submit:hover:not(:disabled) {
      background: var(--admin-primary-hover);
      box-shadow: 0 6px 18px rgba(211, 47, 47, 0.5);
      transform: translateY(-1px);
    }

    .btn-submit:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.82rem;
      color: var(--admin-text-muted);
    }

    .login-footer a {
      color: #cbd5e1;
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s ease;
    }

    .login-footer a:hover {
      color: #fff;
    }

    .security-notice {
      text-align: center;
      margin-top: 16px;
      font-size: 0.74rem;
      color: #64748b;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="login-container">
    <div class="login-card" id="loginCard">
      
      <!-- Brand Header -->
      <div class="brand-header">
        <img src="../images/logo.jpeg" alt="HARICHAND STEEL" class="brand-logo" onerror="this.src='../images/logo.jpeg'">
        <h1 class="brand-title">HARICHAND STEEL</h1>
        <div class="brand-subtitle">CMS Admin Control Panel</div>
        <div class="security-badge">
          <i class="fas fa-lock"></i> Protected Gateway
        </div>
      </div>

      <!-- Real-Time Alert Banner -->
      <div id="loginAlert" class="login-alert" style="display: none;">
        <i id="alertIcon" class="fas fa-exclamation-triangle"></i>
        <span id="alertMessage"></span>
      </div>

      <!-- Login Form -->
      <form id="adminLoginForm" autocomplete="on">
        
        <!-- Username Field -->
        <div class="form-group">
          <label for="adminUsername" class="form-label">Admin Email / Username</label>
          <div class="input-wrapper">
            <input 
              type="text" 
              id="adminUsername" 
              name="username" 
              class="form-input" 
              placeholder="buzzspire.info@gmail.com" autocapitalize="none" autocorrect="off" spellcheck="false" 
              required 
              autocomplete="username"
              autofocus
            >
            <i class="fas fa-user-shield input-icon"></i>
          </div>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label for="adminPassword" class="form-label">Admin Password</label>
          <div class="input-wrapper">
            <input 
              type="password" 
              id="adminPassword" 
              name="password" 
              class="form-input" 
              placeholder="Enter your password" 
              required 
              autocomplete="current-password"
            >
            <i class="fas fa-key input-icon"></i>
            <button type="button" class="toggle-password" id="togglePasswordBtn" aria-label="Toggle password visibility">
              <i class="fas fa-eye" id="togglePasswordIcon"></i>
            </button>
          </div>
        </div>

        <!-- Options -->
        <div class="form-options">
          <label class="remember-label">
            <input type="checkbox" id="rememberMe" checked>
            <span>Remember this device</span>
          </label>
          <span>SS304 Enterprise</span>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submitBtn" class="btn-submit">
          <i class="fas fa-sign-in-alt"></i>
          <span id="btnText">Sign In to Dashboard</span>
        </button>

      </form>

    </div>

    <!-- Login Footer Links -->
    <div class="login-footer">
      <a href="../index.html">
        <i class="fas fa-arrow-left"></i> Return to Harichand Steel Website
      </a>
      <div class="security-notice">
        Session credentials are cryptographic HMAC verified. All administration actions are strictly audited.
      </div>
    </div>
  </div>

  <script>
    (function() {
      const loginForm = document.getElementById('adminLoginForm');
      const loginCard = document.getElementById('loginCard');
      const usernameInput = document.getElementById('adminUsername');
      const passwordInput = document.getElementById('adminPassword');
      const togglePasswordBtn = document.getElementById('togglePasswordBtn');
      const togglePasswordIcon = document.getElementById('togglePasswordIcon');
      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const loginAlert = document.getElementById('loginAlert');
      const alertIcon = document.getElementById('alertIcon');
      const alertMessage = document.getElementById('alertMessage');

      // 1. Password Visibility Toggle
      togglePasswordBtn.addEventListener('click', function() {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        togglePasswordIcon.classList.toggle('fa-eye', !isPassword);
        togglePasswordIcon.classList.toggle('fa-eye-slash', isPassword);
      });

      // 2. Alert Banner Helper
      function showAlert(msg, isSuccess = false) {
        loginAlert.style.display = 'flex';
        loginAlert.className = 'login-alert ' + (isSuccess ? 'success' : 'error');
        alertIcon.className = 'fas ' + (isSuccess ? 'fa-check-circle' : 'fa-exclamation-circle');
        alertMessage.textContent = msg;

        if (!isSuccess) {
          loginCard.classList.remove('shake');
          void loginCard.offsetWidth; // trigger reflow
          loginCard.classList.add('shake');
        }
      }

      function hideAlert() {
        loginAlert.style.display = 'none';
      }

      // 3. Check if already authenticated on page load
      async function checkExistingAuth() {
        try {
          const res = await fetch('/api/admin/check-auth');
          const data = await res.json();
          if (data && data.authenticated) {
            // Already logged in! Redirect straight to admin
            const params = new URLSearchParams(window.location.search);
            const redirectUrl = params.get('redirect') || '/admin';
            window.location.href = redirectUrl;
          }
        } catch (_) {}
      }
      checkExistingAuth();

      // 4. Handle Form Submission
      loginForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        hideAlert();

        const username = usernameInput.value.trim();
        const password = passwordInput.value.trim();

        if (!username || !password) {
          showAlert('Please enter both username and password.');
          return;
        }

        // Disable button & show spinner
        submitBtn.disabled = true;
        btnText.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying Credentials...';

        try {
          const res = await fetch('/api/admin/login', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ username, password })
          });

          const result = await res.json();

          if (res.ok && result.success) {
            showAlert('Authentication verified! Redirecting...', true);
            // Store token in localStorage for client-side API requests
            if (result.token) {
              localStorage.setItem('hs_admin_session', result.token);
            }
            if (result.apiKey) {
              localStorage.setItem('hs_admin_api_key', result.apiKey);
            }

            // Determine redirect target
            const params = new URLSearchParams(window.location.search);
            const redirectUrl = params.get('redirect') || '/admin';

            setTimeout(() => {
              window.location.href = redirectUrl;
            }, 500);
          } else {
            // Wrong credentials: block access completely!
            submitBtn.disabled = false;
            btnText.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In to Dashboard';
            showAlert(result.error || result.message || 'Invalid username or password. Access denied.');
            passwordInput.value = '';
            passwordInput.focus();
          }
        } catch (err) {
          submitBtn.disabled = false;
          btnText.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In to Dashboard';
          showAlert('Network error connecting to authentication server. Please try again.');
        }
      });
    })();
  </script>

</body>
</html>
